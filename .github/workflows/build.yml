name: Build PullOver X (roothide)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos (at /opt/theos as xcconfig expects)
        run: |
          brew install ldid
          # 仓库 xcconfig 写死 THEOS=/opt/theos，直接装到那里
          sudo mkdir -p /opt
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          # rootless/roothide SDK
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz | tar -xz -C /tmp
          sudo cp -r /tmp/sdks-master/*.sdk /opt/theos/sdks/ 2>/dev/null || true
          ls /opt/theos/sdks/ | head -5
          echo "THEOS=/opt/theos" >> $GITHUB_ENV

      - name: Patch theos for roothide substrate
        run: |
          sudo mkdir -p /opt/theos/vendor/lib/iphone/roothide
          sudo cp libsubstrate-roothide.tbd /opt/theos/vendor/lib/iphone/roothide/libsubstrate.tbd

      - name: Install dpkg
        run: brew install dpkg

      - name: Build (roothide scheme)
        run: ./build.sh roothide

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulloverx-roothide-deb
          path: '*.deb'
          if-no-files-found: error
          retention-days: 7
